<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;

    width: 100%;
    max-width: 100%;

    background: transparent;

    overflow: hidden !important;
    overflow-x: hidden !important;
    overflow-y: hidden !important;

    overscroll-behavior: none !important;
    overscroll-behavior-x: none !important;
    overscroll-behavior-y: none !important;

    -webkit-overflow-scrolling: auto !important;

    scrollbar-width: none !important;
    -ms-overflow-style: none !important;
  }

  html::-webkit-scrollbar,
  body::-webkit-scrollbar,
  *::-webkit-scrollbar {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
  }

  body {
    font-family: "Manrope", Arial, sans-serif;
  }

  .bettergas-service-intro {
    width: 100%;
    padding: 28px 20px 42px;
    background: transparent;
  }

  .bettergas-service-intro-wrap {
    width: min(760px, 100%);
    margin: 0 auto;
  }

  .bettergas-service-intro-image-wrap {
    position: relative;
    padding: 0 18px 18px 0;
  }

  .bettergas-service-intro-image {
    position: relative;
    z-index: 2;

    width: 100%;
    height: 430px;

    display: block;
    object-fit: cover;
    object-position: center;

    background: #eef2f6;
  }

  .bettergas-service-intro-accent {
    position: absolute;
    z-index: 1;

    right: 0;
    bottom: 0;

    width: 52%;
    height: 47%;

    background: #FFAB01;
  }

  .bettergas-service-intro-panel {
    position: absolute;
    z-index: 4;

    left: 16px;
    bottom: 28px;

    width: min(470px, calc(100% - 64px));

    padding: 28px 30px;

    background: #1D2756;
    color: #FFFFFF;

    box-shadow: 0 18px 45px rgba(0, 35, 90, 0.14);
  }

  .bettergas-service-intro-eyebrow {
    display: block;

    margin-bottom: 13px;

    color: #FFAB01;

    font-size: 10px;
    font-weight: 800;
    line-height: 1;

    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .bettergas-service-intro-panel h2 {
    margin: 0 0 11px;

    color: #FFFFFF;

    font-size: 27px;
    font-weight: 800;
    line-height: 1.08;

    letter-spacing: -0.035em;
  }

  .bettergas-service-intro-panel p {
    margin: 0;

    color: rgba(255, 255, 255, 0.76);

    font-size: 12px;
    font-weight: 400;
    line-height: 1.7;
  }


  /* ==========================
     ORIGINAL MOBILE LAYOUT
  ========================== */

  @media (max-width: 700px) {

    .bettergas-service-intro {
      padding: 20px 14px 0;
    }

    .bettergas-service-intro-image-wrap {
      padding: 0 10px 10px 0;
    }

    .bettergas-service-intro-image {
      height: 340px;
    }

    .bettergas-service-intro-accent {
      width: 58%;
      height: 42%;
    }

    .bettergas-service-intro-panel {
      position: relative;

      left: 0;
      bottom: auto;

      width: calc(100% - 28px);

      margin: -58px 0 0 14px;

      padding: 23px 22px;
    }

    .bettergas-service-intro-panel h2 {
      font-size: 22px;
    }

    .bettergas-service-intro-panel p {
      font-size: 11px;
    }
  }
</style>
</head>

<body>

<div class="bettergas-service-intro">

  <div class="bettergas-service-intro-wrap">

    <div class="bettergas-service-intro-image-wrap">

      <img
        class="bettergas-service-intro-image"
        src="https://static.wixstatic.com/media/403ad3_a3cc39ee92924088b58bfc1e1283cfe2~mv2.jpg"
        alt="Better Gas professional gas engineering in London"
      >

      <div class="bettergas-service-intro-accent"></div>

      <div class="bettergas-service-intro-panel">

        <span class="bettergas-service-intro-eyebrow">
          Gas Expertise
        </span>

        <h2>
          Professional Gas Engineering Across London
        </h2>

        <p>
          From gas safety checks and appliance installations to
          servicing, repairs and fault diagnosis, Better Gas provides
          dependable Gas Safe services for London properties.
        </p>

      </div>

    </div>

  </div>

</div>

</body>
</html>
