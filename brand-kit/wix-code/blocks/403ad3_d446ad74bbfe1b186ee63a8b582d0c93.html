<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;

  width:100%;
  max-width:100%;

  background:transparent;

  overflow:hidden !important;
  overflow-x:hidden !important;
  overflow-y:hidden !important;

  overscroll-behavior:none !important;
  overscroll-behavior-x:none !important;
  overscroll-behavior-y:none !important;

  -webkit-overflow-scrolling:auto !important;

  scrollbar-width:none !important;
  -ms-overflow-style:none !important;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar,
*::-webkit-scrollbar{
  display:none !important;
  width:0 !important;
  height:0 !important;
}

body{
  font-family:"Manrope",Arial,sans-serif;
}

.bettergas-plumbing-callout{
  width:100%;
  background:transparent;
}

.bettergas-plumbing-callout-inner{
  width:100%;
  max-width:1180px;
  min-height:210px;

  margin:auto;
  padding:38px 44px;

  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:40px;

  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      110deg,
      #1D2756,
      #073476 55%,
      #041B3E
    );

  color:#fff;
}

.bettergas-plumbing-callout-inner::before{
  content:"";

  position:absolute;
  left:0;
  top:0;

  width:6px;
  height:100%;

  background:#FFAB01;
}

.bettergas-plumbing-callout-inner::after{
  content:"";

  position:absolute;
  right:-70px;
  top:-90px;

  width:220px;
  height:220px;

  border-radius:50%;

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
    0 0 0 45px rgba(255,255,255,.02),
    0 0 0 90px rgba(255,255,255,.015);
}

.bettergas-callout-label{
  display:block;

  margin-bottom:10px;

  color:#FFAB01;

  font-size:9px;
  font-weight:800;

  letter-spacing:.1em;
  text-transform:uppercase;
}

.bettergas-plumbing-callout h2{
  margin:0 0 10px;

  color:#fff;

  font-size:30px;
  letter-spacing:-.035em;
}

.bettergas-plumbing-callout p{
  max-width:700px;
  margin:0;

  color:rgba(255,255,255,.67);

  font-size:12px;
  line-height:1.7;
}

.bettergas-plumbing-callout a{
  position:relative;
  z-index:2;

  min-height:50px;

  padding:0 22px;

  display:flex;
  align-items:center;
  gap:12px;

  background:#FFAB01;

  color:#111;

  font-size:11px;
  font-weight:800;

  text-decoration:none;
  white-space:nowrap;

  transition:.25s ease;
}

@media (hover: hover) and (pointer: fine) { .bettergas-plumbing-callout a:hover {
  transform:translateY(-2px);
  background:#FFB82B;
} }

.bettergas-plumbing-callout a span{
  transition:.25s ease;
}

@media (hover: hover) and (pointer: fine) { .bettergas-plumbing-callout a:hover span {
  transform:translateX(4px);
} }

@media(max-width:750px){
  .bettergas-plumbing-callout-inner{
    grid-template-columns:1fr;

    padding:30px 24px;
  }

  .bettergas-plumbing-callout h2{
    font-size:24px;
  }

  .bettergas-plumbing-callout a{
    width:fit-content;
  }
}
</style>
</head>

<body>

<section class="bettergas-plumbing-callout">

  <div class="bettergas-plumbing-callout-inner">

    <div>

      <span class="bettergas-callout-label">
        Urgent Plumbing Support
      </span>

      <h2>
        Water Leak or Urgent Plumbing Problem?
      </h2>

      <p>
        Leaks and burst pipes can quickly cause damage if left unresolved.
        Better Gas provides responsive plumbing support across London to
        identify the problem and carry out the appropriate repair.
      </p>

    </div>


    <a href="tel:08000599951">
      Call 0800 059 9951
      <span>→</span>
    </a>

  </div>

</section>

</body>
</html>
